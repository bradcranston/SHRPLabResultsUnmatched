<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Main Interface with Sample Data</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007cba; color: white; border: none; cursor: pointer; }
        button:hover { background: #005a87; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Test Main Interface with Sample HL7 Data</h1>
    
    <div class="test-section">
        <h2>Test Controls</h2>
        <button onclick="loadSampleData()">Load Sample HL7 Data</button>
        <button onclick="clearData()">Clear Data</button>
    </div>

    <div class="test-section">
        <h2>Main Interface</h2>
        <iframe id="main-interface" src="./index.html"></iframe>
    </div>

    <script>
        async function loadSampleData() {
            try {
                // Load the sample HL7 file
                const response = await fetch('./sample.hl7');
                const hl7Content = await response.text();
                
                console.log('Loaded HL7 content:', hl7Content.substring(0, 200) + '...');
                
                // Get the iframe and call the loadHL7Data function
                const iframe = document.getElementById('main-interface');
                const iframeWindow = iframe.contentWindow;
                
                // Wait for the interface to be ready
                if (iframeWindow.loadLabResults) {
                    const result = await iframeWindow.loadLabResults(hl7Content);
                    console.log('Load result:', result);
                    if (result.success) {
                        alert('Sample data loaded successfully!');
                    } else {
                        alert('Error loading data: ' + result.error);
                    }
                } else {
                    alert('Interface not ready yet. Please wait and try again.');
                }
                
            } catch (error) {
                console.error('Error:', error);
                alert('Error loading sample data: ' + error.message);
            }
        }

        function clearData() {
            const iframe = document.getElementById('main-interface');
            const iframeWindow = iframe.contentWindow;
            
            if (iframeWindow.clearLabResults) {
                const result = iframeWindow.clearLabResults();
                console.log('Clear result:', result);
                alert('Data cleared');
            } else {
                alert('Interface not ready yet.');
            }
        }
    </script>
</body>
</html>
