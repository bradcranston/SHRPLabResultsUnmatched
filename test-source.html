<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Source Files Directly</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007cba; color: white; border: none; cursor: pointer; margin: 5px; }
        .status { margin: 10px 0; padding: 10px; background: #f0f0f0; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Test Source Files Directly</h1>
    
    <div class="test-section">
        <button onclick="loadSampleData()">Load Sample HL7 Data</button>
        <button onclick="inspectLabInfo()">Inspect Lab Info Section</button>
        <div id="status" class="status">Ready to test source files...</div>
    </div>

    <div class="test-section">
        <h2>Source Interface (index.html)</h2>
        <iframe id="interface" src="./index.html" style="width: 100%; height: 600px; border: 1px solid #ccc;"></iframe>
    </div>

    <script>
        async function loadSampleData() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = 'Loading sample HL7 data into source interface...';
            
            try {
                // Load the sample HL7 file
                const response = await fetch('./sample.hl7');
                const hl7Content = await response.text();
                
                console.log('Loaded HL7 content length:', hl7Content.length);
                
                // Get the iframe window
                const iframe = document.getElementById('interface');
                const iframeWindow = iframe.contentWindow;
                
                // Wait for the interface to be ready
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                if (iframeWindow.loadLabResults) {
                    statusDiv.innerHTML = 'Calling loadLabResults function...';
                    
                    const result = await iframeWindow.loadLabResults(hl7Content);
                    console.log('Load result:', result);
                    
                    if (result && result.success) {
                        statusDiv.innerHTML = '<div class="success">✓ Sample data loaded successfully into source interface!</div>';
                        
                        // Wait a moment then check the lab info section
                        setTimeout(() => {
                            inspectLabInfo();
                        }, 1000);
                    } else {
                        statusDiv.innerHTML = '<div class="error">✗ Error loading data: ' + (result ? result.error : 'Unknown error') + '</div>';
                    }
                } else {
                    statusDiv.innerHTML = '<div class="error">✗ Interface not ready. loadLabResults function not available.</div>';
                    console.log('Available functions:', Object.keys(iframeWindow).filter(k => k.includes('Lab')));
                }
                
            } catch (error) {
                console.error('Error:', error);
                statusDiv.innerHTML = '<div class="error">✗ Error: ' + error.message + '</div>';
            }
        }

        function inspectLabInfo() {
            const iframe = document.getElementById('interface');
            const iframeWindow = iframe.contentWindow;
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            const labInfoSection = iframeDoc.getElementById('lab-info');
            if (labInfoSection) {
                console.log('Lab info section found:', labInfoSection);
                console.log('Lab info content:', labInfoSection.innerHTML);
                
                const statusDiv = document.getElementById('status');
                const labInfoHTML = labInfoSection.innerHTML;
                
                // Check if our new fields are present
                const hasPerformingLab = labInfoHTML.includes('Performing Laboratory');
                const hasLabAddress = labInfoHTML.includes('Laboratory Address');
                const hasMedicalDirector = labInfoHTML.includes('Medical Director');
                
                let report = '<div><strong>Source Lab Info Section Analysis:</strong></div>';
                report += `<div>Performing Laboratory field: ${hasPerformingLab ? '✓ Found' : '✗ Missing'}</div>`;
                report += `<div>Laboratory Address field: ${hasLabAddress ? '✓ Found' : '✗ Missing'}</div>`;
                report += `<div>Medical Director field: ${hasMedicalDirector ? '✓ Found' : '✗ Missing'}</div>`;
                
                if (hasPerformingLab || hasLabAddress || hasMedicalDirector) {
                    report += '<div class="success">✓ New fields found in source interface!</div>';
                    
                    // Also check the values
                    const labDetails = labInfoSection.querySelectorAll('.detail-item');
                    labDetails.forEach(item => {
                        const label = item.querySelector('.detail-label');
                        const value = item.querySelector('.detail-value');
                        if (label && value) {
                            const labelText = label.textContent;
                            const valueText = value.textContent;
                            if (labelText.includes('Performing Laboratory') || 
                                labelText.includes('Laboratory Address') || 
                                labelText.includes('Medical Director')) {
                                report += `<div><strong>${labelText}:</strong> ${valueText}</div>`;
                            }
                        }
                    });
                } else {
                    report += '<div class="error">✗ New fields not found. Current content:</div>';
                    report += `<div style="background:#f5f5f5; padding:10px; margin:10px 0; font-family:monospace; font-size:12px;">${labInfoHTML}</div>`;
                }
                
                statusDiv.innerHTML = report;
            } else {
                document.getElementById('status').innerHTML = '<div class="error">✗ Lab info section not found in source interface</div>';
            }
        }

        // Auto-load after interface loads
        setTimeout(() => {
            loadSampleData();
        }, 3000);
    </script>
</body>
</html>
