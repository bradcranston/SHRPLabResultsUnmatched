<!DOCTYPE html>
<html>
<head>
    <title>OBX Field Analysis</title>
    <style>
        body { font-family: monospace; margin: 20px; }
        .field { margin: 5px 0; padding: 5px; background: #f0f0f0; }
        .field-number { font-weight: bold; color: blue; }
        .field-content { color: #333; }
    </style>
</head>
<body>
    <h1>OBX Field Analysis</h1>
    <div id="analysis"></div>

    <script>
        // First OBX line from sample.hl7
        const obxLine = 'OBX|1|ST|21613-5^C trach DNA Spec Ql NAA+probe^LN^Chlamydia t^Chlamydia trachomatis^L||NEGATIVE||NOT PRESENT|N|||F|||20250826080500|||||20250826140822||||Aegis Sciences Corporation^^^^^CLIA&2.16.840.1.113883.3.8748&ISO^XX^^^44D2062333|501 Great Circle Road^^Nashville^TN^37228|^Hardison^Matthew^T^PhD';
        
        const fields = obxLine.split('|');
        
        let html = '<h2>OBX Fields Analysis:</h2>';
        
        fields.forEach((field, index) => {
            html += `<div class="field">`;
            html += `<span class="field-number">Field ${index}:</span> `;
            html += `<span class="field-content">${field || '(empty)'}</span>`;
            html += `</div>`;
        });
        
        html += '<h2>Key Fields for Our Use:</h2>';
        html += `<div class="field"><span class="field-number">Field 15 (Performing Org):</span> <span class="field-content">${fields[15] || '(empty)'}</span></div>`;
        html += `<div class="field"><span class="field-number">Field 16 (Org Address):</span> <span class="field-content">${fields[16] || '(empty)'}</span></div>`;
        html += `<div class="field"><span class="field-number">Field 17 (Medical Director):</span> <span class="field-content">${fields[17] || '(empty)'}</span></div>`;
        
        document.getElementById('analysis').innerHTML = html;
    </script>
</body>
</html>
