<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Lab Info Rendering</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; }
        .detail-item { margin: 10px 0; }
        .detail-label { font-weight: bold; display: inline-block; width: 200px; }
        .detail-value { display: inline-block; }
        .error { color: red; }
        .success { color: green; }
        button { padding: 10px 20px; background: #007cba; color: white; border: none; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>
    <h1>Debug Lab Information Rendering</h1>
    
    <button onclick="testParsing()">Test HL7 Parsing</button>
    <button onclick="testLabInfoRendering()">Test Lab Info Rendering</button>
    
    <div class="debug-section">
        <h2>HL7 Parser Test Results</h2>
        <div id="parser-results"></div>
    </div>

    <div class="debug-section">
        <h2>Lab Info Rendering Test</h2>
        <div id="lab-info" class="lab-details"></div>
    </div>

    <div class="debug-section">
        <h2>Raw Parsed Data</h2>
        <pre id="raw-data"></pre>
    </div>

    <script type="module">
        import HL7Parser from './src/hl7-parser.js';

        let parsedData = null;

        window.testParsing = async function() {
            try {
                const parser = new HL7Parser();
                
                // Load the sample HL7 file
                const response = await fetch('./sample.hl7');
                const hl7Content = await response.text();
                
                // Parse the HL7 content
                parsedData = parser.parseHL7String(hl7Content);
                
                console.log('Parsed data:', parsedData);
                
                const resultsDiv = document.getElementById('parser-results');
                
                if (parsedData && parsedData.OBR && parsedData.OBR.length > 0) {
                    const firstOBR = parsedData.OBR[0];
                    if (firstOBR.OBX && firstOBR.OBX.length > 0) {
                        const firstOBX = firstOBR.OBX[0];
                        
                        resultsDiv.innerHTML = `
                            <div class="success">✓ Parsing successful</div>
                            <div class="detail-item">
                                <span class="detail-label">PerformingOrganization:</span>
                                <span class="detail-value">${firstOBX.PerformingOrganization || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">PerformingOrganizationName:</span>
                                <span class="detail-value">${firstOBX.PerformingOrganizationName || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">PerformingOrganizationAddress:</span>
                                <span class="detail-value">${firstOBX.PerformingOrganizationAddress || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">PerformingOrganizationAddressParsed:</span>
                                <span class="detail-value">${firstOBX.PerformingOrganizationAddressParsed || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">MedicalDirector:</span>
                                <span class="detail-value">${firstOBX.MedicalDirector || 'N/A'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">MedicalDirectorName:</span>
                                <span class="detail-value">${firstOBX.MedicalDirectorName || 'N/A'}</span>
                            </div>
                        `;
                        
                        // Show raw data
                        document.getElementById('raw-data').textContent = JSON.stringify(firstOBX, null, 2);
                        
                    } else {
                        resultsDiv.innerHTML = '<div class="error">✗ No OBX data found</div>';
                    }
                } else {
                    resultsDiv.innerHTML = '<div class="error">✗ No OBR data found</div>';
                }
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('parser-results').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        };

        window.testLabInfoRendering = function() {
            if (!parsedData) {
                alert('Please run HL7 parsing test first');
                return;
            }
            
            // Simulate the renderLabInfo function
            const msh = parsedData.MSH || {};
            const container = document.getElementById('lab-info');
            
            // Extract performing site and medical director from first OBX segment
            let performingSite = 'N/A';
            let performingSiteAddress = 'N/A';
            let medicalDirector = 'N/A';
            
            if (parsedData.OBR && parsedData.OBR.length > 0) {
                const firstOBR = parsedData.OBR[0];
                if (firstOBR.OBX && firstOBR.OBX.length > 0) {
                    const firstOBX = firstOBR.OBX[0];
                    if (firstOBX.PerformingOrganizationName && firstOBX.PerformingOrganizationName !== 'N/A') {
                        performingSite = firstOBX.PerformingOrganizationName;
                    }
                    if (firstOBX.PerformingOrganizationAddressParsed && firstOBX.PerformingOrganizationAddressParsed !== 'N/A') {
                        performingSiteAddress = firstOBX.PerformingOrganizationAddressParsed;
                    }
                    if (firstOBX.MedicalDirectorName && firstOBX.MedicalDirectorName !== 'N/A') {
                        medicalDirector = firstOBX.MedicalDirectorName;
                    }
                }
            }
            
            function formatDateTime(dateTime) {
                if (!dateTime) return 'N/A';
                // Simple formatting for testing
                return dateTime;
            }
            
            const formattedDateTime = formatDateTime(msh.DateTime);
            
            const labDetails = [
                { label: 'Sending Facility', value: msh.SendingFacility || 'N/A' },
                { label: 'Sending Application', value: msh.SendingApp || 'N/A' },
                { label: 'Performing Laboratory', value: performingSite },
                { label: 'Laboratory Address', value: performingSiteAddress },
                { label: 'Medical Director', value: medicalDirector },
                { label: 'Report Date/Time', value: formattedDateTime },
                { label: 'Message Control ID', value: msh.MessageControlID || 'N/A' },
                { label: 'Processing ID', value: msh.ProcessingID || 'N/A' },
                { label: 'Version', value: msh.Version || 'N/A' }
            ];

            const html = labDetails.map(detail => `
                <div class="detail-item">
                    <div class="detail-label">${detail.label}</div>
                    <div class="detail-value">${detail.value}</div>
                </div>
            `).join('');
            
            container.innerHTML = html;
        };
    </script>
</body>
</html>
